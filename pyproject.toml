[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "3 days"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]

[project]
name = "freetser"
version = "0.5.0"
description = "A free-threaded HTTP server built on top of h11"
authors = [
    { name = "Tip ten Brink", email = "tip@tenbrinkmeijs.com" },
]
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "h11>=0.16.0,<0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "requests>=2.32.0",
    "ruff>=0.15.0",
    "ty>=0.0.27",
]

[tool.ruff]
target-version = "py314"
# Ruff 0.17 also formats Markdown and enables more rules by default. Keep the
# checks CI ran before, so a Ruff upgrade does not change what passes.
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
