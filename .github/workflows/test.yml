name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FREETSER_TEST_PORT: 8000

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244
        with:
          enable-cache: true
          version: "0.9.11"
          prune-cache: false

      - name: Set up Python
        run: uv python install 3.14t

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run type checker
        run: uv run ty check

      - name: Run pytest
        run: uv run pytest -v
